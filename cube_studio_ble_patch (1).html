<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>8x8x8 LED Cube Studio Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #e0e0e0; margin: 20px; text-align: center; }
        h1 { color: #00e676; }
        .btn { background: #333; color: #fff; border: none; padding: 12px 24px; margin: 5px; font-size: 16px; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #444; }
        .btn-active { background: #00e676 !important; color: #000 !important; font-weight: bold; }
        .control-group { margin: 20px auto; max-width: 600px; padding: 15px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; }
        .slider { width: 80%; max-width: 300px; margin: 15px; }
        .status { font-weight: bold; color: #ff5252; margin: 10px; }
        .connected { color: #00e676; }
    </style>
</head>
<body>

    <h1>8x8x8 LED Cube Studio Pro</h1>
    <div id="status" class="status">Status: Disconnected</div>
    
    <button class="btn" id="btnConnect" onclick="connectBLE()">Pair HM-10 BLE Module</button>
    <button class="btn" id="btnDisconnect" onclick="disconnectBLE()" style="display:none;">Disconnect</button>

    <div class="control-group">
        <h3>Cube Mode Controls</h3>
        <button class="btn" id="modeA" onclick="sendMode('A')">Auto Mode ('A')</button>
        <button class="btn" id="modeM" onclick="sendMode('M')">Manual Mode ('M')</button>
        <button class="btn" id="modeN" onclick="sendMode('N')">Next Pattern ('N')</button>
        <button class="btn" id="modeD" onclick="sendMode('D')">Draw Mode ('D')</button>
    </div>

    <div class="control-group">
        <h3>Brightness Level Control</h3>
        <input type="range" min="2" max="8" value="8" class="slider" id="brightSlider" onchange="updateBrightness(this.value)">
        <div>Value: <span id="brightVal">8</span></div>
    </div>

    <div class="control-group">
        <h3>3D Vector Translation & Rotation</h3>
        <button class="btn" onclick="sendVector('X', '+')">Shift +X</button>
        <button class="btn" onclick="sendVector('X', '-')">Shift -X</button><br>
        <button class="btn" onclick="sendVector('Y', '+')">Shift +Y</button>
        <button class="btn" onclick="sendVector('Y', '-')">Shift -Y</button><br>
        <button class="btn" onclick="sendVector('Z', '+')">Shift +Z</button>
        <button class="btn" onclick="sendVector('Z', '-')">Shift -Z</button><br><br>
        <button class="btn" onclick="sendRotation('X')">Rotate Middle X-Axis</button>
        <button class="btn" onclick="sendRotation('Y')">Rotate Middle Y-Axis</button>
        <button class="btn" onclick="sendRotation('Z')">Rotate Middle Z-Axis</button>
    </div>

    <div class="control-group">
        <h3>Local Animation File Operations</h3>
        <button class="btn" onclick="promptSaveFile()">Export / Save Template (.txt)</button><br><br>
        <input type="file" id="fileInput" accept=".txt,.bin" style="display:none;" onchange="handleFileUpload(event)">
        <button class="btn" onclick="document.getElementById('fileInput').click()">Upload Animation Template</button>
    </div>

    <script>
        let bleDevice = null;
        let bleCharacteristic = null;
        const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
        const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "Status: Searching...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                document.getElementById('status').innerText = "Status: Connected";
                document.getElementById('status').className = "status connected";
                document.getElementById('btnConnect').style.display = "none";
                document.getElementById('btnDisconnect').style.display = "inline-block";
                
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
            } catch(e) {
                document.getElementById('status').innerText = "Status: Connection Failed";
                console.error(e);
            }
        }

        async function disconnectBLE() {
            if (!bleDevice) return;
            try {
                // Send explicit exit token 'Q' before closing line link profiles
                if (bleCharacteristic) {
                    await bleCharacteristic.writeValue(new Uint8Array([81])); // 'Q'
                }
            } catch(e) { console.log("Pre-disconnect write skipped"); }
            bleDevice.gatt.disconnect();
        }

        function onDisconnected() {
            document.getElementById('status').innerText = "Status: Disconnected";
            document.getElementById('status').className = "status";
            document.getElementById('btnConnect').style.display = "inline-block";
            document.getElementById('btnDisconnect').style.display = "none";
            bleCharacteristic = null;
            bleDevice = null;
        }

        async function sendTx(bytes) {
            if (!bleCharacteristic) return;
            try {
                await bleCharacteristic.writeValue(new Uint8Array(bytes));
            } catch(e) { console.error("TX error: ", e); }
        }

        function sendMode(modeChar) {
            sendTx([modeChar.charCodeAt(0)]);
            document.querySelectorAll('.control-group .btn').forEach(b => b.classList.remove('btn-active'));
            if(modeChar !== 'N') {
                const el = document.getElementById('mode' + modeChar);
                if(el) el.classList.add('btn-active');
            }
        }

        function updateBrightness(val) {
            document.getElementById('brightVal').innerText = val;
            sendTx(['B'.charCodeAt(0), parseInt(val)]);
        }

        function sendVector(axis, dir) {
            sendTx([axis.charCodeAt(0), dir.charCodeAt(0)]);
        }

        function sendRotation(axis) {
            sendTx(['R'.charCodeAt(0), axis.charCodeAt(0)]);
        }

        function promptSaveFile() {
            const defaultContent = "# 8x8x8 LED Cube Frame Template\nM\nN\nB\\x08\nX+\nRY\n";
            const blob = new Blob([defaultContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "cube_animation.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const lines = e.target.result.split('\n');
                for (let line of lines) {
                    line = line.trim();
                    if (!line || line.startsWith('#')) continue;
                    let bytes = [];
                    for(let i=0; i<line.length; i++) {
                        bytes.push(line.charCodeAt(i));
                    }
                    if(bytes.length > 0) {
                        await sendTx(bytes);
                        await new Promise(r => setTimeout(r, 15)); // Guard delay pace
                    }
                }
                alert("Template stream completed successfully!");
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
