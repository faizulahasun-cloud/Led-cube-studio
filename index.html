<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8x8x8 LED Cube Studio Pro</title>
<style>
:root {
    --bg: #121212;
    --panel: #1e1e1e;
    --panel2: #252525;
    --line: #333333;
    --text: #e0e0e0;
    --muted: #888888;
    --accent: #00ff66;
    --accent-dim: #0bb34c;
    --danger: #ff3333;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
h1 {
    font-weight: 400;
    margin-bottom: 20px;
    letter-spacing: 1px;
    color: #ffffff;
}
.app-container {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
.card {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 15px;
    flex: 1;
    min-width: 250px;
}
.btn {
    background: var(--line);
    border: none;
    color: var(--text);
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
}
.btn:hover { background: #444; }
.btn-connect { background: var(--accent-dim); color: #000; }
.btn-connect:hover { background: var(--accent); }
.btn-danger { background: #5a1818; color: #ff9999; }
.btn-danger:hover { background: var(--danger); color: #000; }
.btn-active {
    background: var(--accent) !important;
    color: #000 !important;
    box-shadow: 0 0 8px var(--accent);
}
.grid-container {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 15px;
    max-width: 360px;
}
.voxel {
    aspect-ratio: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.1s;
}
.voxel.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
}
.slider-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}
input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
}
.nav-tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
}
.tab {
    padding: 6px 12px;
    background: var(--panel2);
    border: 1px solid var(--line);
    cursor: pointer;
    border-radius: 4px 4px 0 0;
}
.tab.active {
    background: var(--line);
    border-bottom: 2px solid var(--accent);
}
</style>
</head>
<body>

<h1>8x8x8 LED Cube Studio Pro</h1>

<div class="app-container">
    <div class="row">
        <!-- Hardware Connection Panel Card -->
        <div class="card">
            <h3>Hardware Connection</h3>
            <p style="margin: 10px 0; font-size:14px; color:var(--muted);">Pair your HM-10 BLE module here.</p>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-connect" id="connectBtn">Connect Cube</button>
                <button class="btn btn-danger" id="clearBtn">Clear Canvas</button>
            </div>
            <p id="statusLabel" style="margin-top:10px; font-size:14px; color:var(--danger);">Status: Disconnected</p>
        </div>

        <!-- Mode & Manual Automation Input Control Card -->
        <div class="card">
            <h3>Cube Mode Controls</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:12px;">
                <button class="btn btn-active" id="modeABtn">Auto Mode ('A')</button>
                <button class="btn" id="modeMBtn">Manual Mode ('M')</button>
                <button class="btn" id="nextBtn">Next Pattern ('N')</button>
                <button class="btn" id="prevBtn">Prev Pattern ('P')</button>
                <button class="btn" id="modeDBtn" style="grid-column: span 2;">Draw Mode ('D')</button>
            </div>
            <div class="slider-container">
                <label style="font-size:14px;">Brightness Level ('B'): <span id="brightVal">8</span></label>
                <input type="range" id="brightSlider" min="2" max="8" value="8">
            </div>
        </div>
    </div>

    <!-- 2D Slice Layer Editor Interface Panel Card -->
    <div class="card">
        <h3>2D Layer Matrix Editor</h3>
        <p style="font-size:13px; color:var(--muted); margin-bottom:10px;">Select a Z-Layer depth view to map individual voxels.</p>
        <div class="nav-tabs" id="layerTabs"></div>
        <div class="grid-container" id="voxelGrid"></div>
    </div>
</div>

<script>
// Default identifiers for communication mapping layer
const HM10_SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
const HM10_CHAR_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

let bleDevice = null;
let bleCharacteristic = null;
let currentZLayer = 0;
let currentAppMode = 'A'; // Tracks current UI state: 'A', 'M', or 'D'

// Internal packed 64-byte row structure array configuration tracking canvas states
let cubeMatrixData = new Uint8Array(64);

const gridContainer = document.getElementById('voxelGrid');
const tabsContainer = document.getElementById('layerTabs');
const statusLabel = document.getElementById('statusLabel');
const connectBtn = document.getElementById('connectBtn');

function updateStatus(text, colorVar) {
    statusLabel.innerText = text;
    if (colorVar) {
        statusLabel.style.color = colorVar;
    }
    console.log(text);
}

// Warn early if not secure context
if (!window.isSecureContext) {
    updateStatus('Status: Insecure context — Web Bluetooth requires HTTPS or localhost', 'var(--danger)');
    // Keep the button available but show warning; many users will host on GitHub Pages (https) which is secure.
}

// Generate structural tab selection buttons
for (let z = 0; z < 8; z++) {
    const tab = document.createElement('div');
    tab.className = `tab ${z === 0 ? 'active' : ''}`;
    tab.innerText = `Z-Layer ${z}`;
    tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentZLayer = z;
        renderActiveGridLayer();
    };
    tabsContainer.appendChild(tab);
}

// Generate interaction canvas voxels matching matrix row flags
function renderActiveGridLayer() {
    gridContainer.innerHTML = '';
    for (let y = 0; y < 8; y++) {
        for (let x = 0; x < 8; x++) {
            const voxel = document.createElement('div');
            voxel.className = 'voxel';
            
            let byteIndex = currentZLayer * 8 + y;
            let isVoxelActive = (cubeMatrixData[byteIndex] & (1 << x)) !== 0;
            
            if (isVoxelActive) voxel.classList.add('active');
            
            voxel.onclick = () => {
                // If user clicks a voxel on the grid, automatically jump UI to Draw Mode highlight
                if (currentAppMode !== 'D') {
                    highlightModeButton('D');
                    sendSingleCommandChar('D');
                }
                
                if ((cubeMatrixData[byteIndex] & (1 << x)) !== 0) {
                    cubeMatrixData[byteIndex] &= ~(1 << x);
                    voxel.classList.remove('active');
                } else {
                    cubeMatrixData[byteIndex] |= (1 << x);
                    voxel.classList.add('active');
                }
                streamFullMatrixFrame(); 
            };
            gridContainer.appendChild(voxel);
        }
    }
}

// --- SAFE MTU SEGMENTATION WRITE LOOP ---
let transmitQueue = Promise.resolve();

async function transmitRawPayload(buffer) {
    // Accept ArrayBuffer or Uint8Array
    const payload = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
    transmitQueue = transmitQueue.then(async () => {
        if (!bleCharacteristic) {
            console.warn('No BLE characteristic — dropping payload');
            return;
        }

        try {
            const CHUNK_SIZE = 16;
            for (let i = 0; i < payload.byteLength; i += CHUNK_SIZE) {
                const chunk = payload.slice(i, i + CHUNK_SIZE);
                try {
                    // Prefer writeWithoutResponse when available for faster writes
                    if (bleCharacteristic.writeValueWithoutResponse) {
                        await bleCharacteristic.writeValueWithoutResponse(chunk);
                    } else if (bleCharacteristic.writeValue) {
                        await bleCharacteristic.writeValue(chunk);
                    } else {
                        // fallback to buffer form
                        await bleCharacteristic.writeValue(chunk.buffer);
                    }
                } catch (writeErr) {
                    // one more fallback attempt using ArrayBuffer
                    try {
                        await bleCharacteristic.writeValue(chunk.buffer);
                    } catch (finalErr) {
                        console.error('Write failed for chunk', finalErr);
                        throw finalErr;
                    }
                }

                // small pacing delay to avoid overflowing HM-10
                await new Promise(resolve => setTimeout(resolve, 20));
            }
        } catch (err) {
            console.error('Transmission chunk segment dropped: ', err);
            updateStatus('Status: Transmission error', 'var(--danger)');
        }
    });

    return transmitQueue;
}

// Packages the standard 66-byte framing packet structure
function streamFullMatrixFrame() {
    let packet = new Uint8Array(66);
    packet[0] = 83; // ASCII 'S' header literal byte
    
    let runningChecksum = 0;
    for (let i = 0; i < 64; i++) {
        packet[i + 1] = cubeMatrixData[i];
        runningChecksum ^= cubeMatrixData[i];
    }
    packet[65] = runningChecksum;
    transmitRawPayload(packet.buffer);
}

// Sends isolated standalone command character pulses
function sendSingleCommandChar(char) {
    let buffer = new Uint8Array([char.charCodeAt(0)]);
    return transmitRawPayload(buffer);
}

// Utility to handle button visual highlights
function highlightModeButton(mode) {
    currentAppMode = mode;
    document.getElementById('modeABtn').classList.remove('btn-active');
    document.getElementById('modeMBtn').classList.remove('btn-active');
    document.getElementById('modeDBtn').classList.remove('btn-active');
    
    if (mode === 'A') document.getElementById('modeABtn').classList.add('btn-active');
    if (mode === 'M') document.getElementById('modeMBtn').classList.add('btn-active');
    if (mode === 'D') document.getElementById('modeDBtn').classList.add('btn-active');
}

function handleModeFeedback(event) {
    const mode = String.fromCharCode(event.target.value.getUint8(0));
    if (mode === 'A' || mode === 'M' || mode === 'D') {
        highlightModeButton(mode);
    }
}

// --- CORE INTERFACE ATTACHMENTS ---
connectBtn.onclick = async () => {
    // If already connected, toggle disconnect
    try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
            bleDevice.gatt.disconnect();
            updateStatus('Status: Disconnected', 'var(--danger)');
            connectBtn.innerText = 'Connect Cube';
            connectBtn.disabled = false;
            return;
        }

        if (!navigator.bluetooth) {
            updateStatus('Status: Web Bluetooth not supported in this browser', 'var(--danger)');
            return;
        }

        updateStatus('Status: Scanning Devices...', 'var(--muted)');

        // For debugging and broad compatibility, use acceptAllDevices: true and request the HM-10 service as optional
        // Once your device is discovered you can tighten filters (name, namePrefix, service) if needed.
        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [HM10_SERVICE_UUID]
            // If you want to restrict by name: filters: [{ namePrefix: 'HM' }], optionalServices: [HM10_SERVICE_UUID]
        });

        updateStatus('Status: Connecting...', 'var(--muted)');
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(HM10_SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(HM10_CHAR_UUID);

        if (bleCharacteristic.properties.notify) {
            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', handleModeFeedback);
        }

        updateStatus('Status: Connected', 'var(--accent)');
        connectBtn.innerText = 'Disconnect';

        // Select the web app's default mode after the Bluetooth connection is ready.
        await sendSingleCommandChar('A');

        bleDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus('Status: Disconnected', 'var(--danger)');
            connectBtn.innerText = 'Connect Cube';
            bleCharacteristic = null;
            bleDevice = null;
        });

    } catch (error) {
        const name = error && error.name ? error.name : 'Error';
        const msg = error && error.message ? error.message : '';
        updateStatus('Status: Pairing Failed — ' + name + (msg ? ': ' + msg : ''), 'var(--danger)');
        console.error(error);
        if (error && error.name === 'NotFoundError') {
            console.warn('Device not found — try power-cycling the HM-10, unpairing it from the OS, or use acceptAllDevices:true');
        }
    }
};

document.getElementById('clearBtn').onclick = () => {
    cubeMatrixData.fill(0);
    renderActiveGridLayer();
    // Always stream cleared frame when connected to keep hardware in sync
    if (bleCharacteristic) streamFullMatrixFrame();
};

// Clean command triggers
document.getElementById('modeABtn').onclick = () => {
    highlightModeButton('A');
    sendSingleCommandChar('A');
};

document.getElementById('modeMBtn').onclick = () => {
    highlightModeButton('M');
    sendSingleCommandChar('M');
};

document.getElementById('modeDBtn').onclick = () => {
    highlightModeButton('D');
    sendSingleCommandChar('D');
};

document.getElementById('nextBtn').onclick = () => {
    // Only pass 'N' in manual mode.
    if (currentAppMode === 'M') {
        sendSingleCommandChar('N');
    }
};

document.getElementById('prevBtn').onclick = () => {
    // Only pass 'P' in manual mode.
    if (currentAppMode === 'M') {
        sendSingleCommandChar('P');
    }
};

document.getElementById('brightSlider').oninput = (event) => {
    const value = parseInt(event.target.value, 10);
    document.getElementById('brightVal').innerText = value;
    if (!bleCharacteristic) return;

    // ASCII 'B' header followed by the raw brightness value.
    const packet = new Uint8Array([66, value]);
    transmitRawPayload(packet);
};

// Initial canvas deployment
renderActiveGridLayer();
</script>
</body>
</html>
