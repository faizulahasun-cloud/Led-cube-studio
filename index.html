<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8x8x8 LED Cube Studio Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00adb5; margin-bottom: 5px; }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            background: #ff4757;
        }
        .status-badge.connected { background: #2ed573; }
        button {
            background: #393e46;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background: #4e5561; }
        button.primary { background: #00adb5; }
        button.primary:hover { background: #00b7c0; }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .slider-container {
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        input[type=range] {
            flex-grow: 1;
            margin-left: 15px;
            accent-color: #00adb5;
        }
        .matrix-editor {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        .layer-selector { margin-bottom: 10px; }
        .grid-8x8 {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #252525;
            padding: 8px;
            border-radius: 4px;
        }
        .voxel {
            width: 30px;
            height: 30px;
            background: #444;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .voxel.active {
            background: #00adb5;
            box-shadow: 0 0 8px #00adb5;
        }
    </style>
</head>
<body>

    <h1>8x8x8 LED Cube Studio Pro</h1>
    
    <div class="container">
        <div class="status-panel">
            <span>Status: <span id="statusText">Disconnected</span></span>
            <span id="statusBadge" class="status-badge">●</span>
        </div>
        <button id="connectBtn" class="primary">Pair HM-10 BLE Module</button>
        <button id="disconnectBtn" style="display:none;">Disconnect</button>
    </div>

    <div class="container">
        <h3>Cube Mode Controls</h3>
        <div class="control-grid">
            <button onclick="sendCommand('A')">Auto Mode ('A')</button>
            <button onclick="sendCommand('M')">Manual Mode ('M')</button>
            <button onclick="sendCommand('N')">Next Pattern ('N')</button>
            <button onclick="sendCommand('P')">Prev Pattern ('P')</button>
            <button onclick="sendCommand('D')">Draw Mode ('D')</button>
            <button onclick="clearCanvas()" class="primary">Clear Canvas</button>
        </div>
        
        <div class="slider-container">
            <span>Brightness Level ('B'): <strong id="brightVal">8</strong></span>
            <input type="range" id="brightSlider" min="2" max="8" value="8" oninput="sendBrightness(this.value)">
        </div>
    </div>

    <div class="container">
        <h3>2D Layer Matrix Editor (Draw Mode)</h3>
        <div class="matrix-editor">
            <div class="layer-selector">
                <label>Select Z-Layer depth view: </label>
                <select id="layerSelect" onchange="renderEditorLayer()">
                    <option value="0">Layer 0 (Bottom)</option>
                    <option value="1">Layer 1</option>
                    <option value="2">Layer 2</option>
                    <option value="3">Layer 3</option>
                    <option value="4">Layer 4</option>
                    <option value="5">Layer 5</option>
                    <option value="6">Layer 6</option>
                    <option value="7">Layer 7 (Top)</option>
                </select>
            </div>
            <div id="pixelGrid" class="grid-8x8"></div>
        </div>
    </div>

    <script>
        const HM10_SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
        const HM10_CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

        let bleDevice = null;
        let gattCharacteristic = null;
        
        // 8 planes of 8 rows of 8 bits = 64 bytes total canvas state matrix
        let cubeCanvas = new Uint8Array(64);

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');

        connectBtn.addEventListener('click', async () => {
            try {
                statusText.innerText = "Requesting device...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [HM10_SERVICE_UUID] }, { namePrefix: 'HM-' }]
                });

                statusText.innerText = "Connecting to GATT Server...";
                const server = await bleDevice.gatt.connect();

                statusText.innerText = "Getting Service...";
                const service = await server.getPrimaryService(HM10_SERVICE_UUID);

                statusText.innerText = "Getting Characteristic...";
                gattCharacteristic = await service.getCharacteristic(HM10_CHARACTERISTIC_UUID);

                statusText.innerText = "Connected";
                statusBadge.classList.add('connected');
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'inline-block';

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
            } catch (error) {
                console.error(error);
                statusText.innerText = "Connection failed: " + error.message;
                onDisconnected();
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
        });

        function onDisconnected() {
            bleDevice = null;
            gattCharacteristic = null;
            statusText.innerText = "Disconnected";
            statusBadge.classList.remove('connected');
            connectBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
        }

        async function sendCommand(charCmd) {
            if (!gattCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await gattCharacteristic.writeValue(encoder.encode(charCmd));
                console.log(`Command sent: ${charCmd}`);
            } catch (error) {
                console.error("Transmission error:", error);
            }
        }

        async function sendBrightness(val) {
            document.getElementById('brightVal').innerText = val;
            if (!gattCharacteristic) return;
            try {
                const buffer = new Uint8Array([66, parseInt(val)]); // 'B' prefix + numeric value byte
                await gattCharacteristic.writeValue(buffer);
            } catch (error) {
                console.error("Brightness transfer error:", error);
            }
        }

        // Fixed MTU Chunking mechanism slicing frame matrix state transmission securely below 20 bytes
        async function transmitCubeFrame() {
            if (!gattCharacteristic) return;
            
            // Build the payload: 'S' Header + 64 Bytes Data + 1 Byte Checksum
            let payload = new Uint8Array(66);
            payload[0] = 83; // 'S'
            
            let checksum = 0;
            for(let i=0; i<64; i++) {
                payload[i+1] = cubeCanvas[i];
                checksum ^= cubeCanvas[i];
            }
            payload[65] = checksum;

            // Safe sliced packet transfers avoiding HM-10 radio bottlenecks
            const chunkSize = 16; 
            for (let offset = 0; offset < payload.length; offset += chunkSize) {
                const slice = payload.slice(offset, offset + chunkSize);
                await gattCharacteristic.writeValue(slice);
                // Mandatory processing block pause window giving transceiver queue space to breathe
                await new Promise(resolve => setTimeout(resolve, 25));
            }
            console.log("Transmitted complete 66-byte packet chunk sequence successfully.");
        }

        function toggleVoxel(x, y, z) {
            const index = (z * 8) + y;
            cubeCanvas[index] ^= (1 << x);
            renderEditorLayer();
            transmitCubeFrame();
        }

        function clearCanvas() {
            cubeCanvas.fill(0);
            renderEditorLayer();
            transmitCubeFrame();
        }

        function renderEditorLayer() {
            const zLayer = parseInt(document.getElementById('layerSelect').value);
            const gridContainer = document.getElementById('pixelGrid');
            gridContainer.innerHTML = '';

            for (let y = 0; y < 8; y++) {
                const index = (zLayer * 8) + y;
                const rowByte = cubeCanvas[index];
                for (let x = 0; x < 8; x++) {
                    const voxelDiv = document.createElement('div');
                    voxelDiv.className = 'voxel';
                    if (rowByte & (1 << x)) {
                        voxelDiv.classList.add('active');
                    }
                    voxelDiv.onclick = () => toggleVoxel(x, y, zLayer);
                    gridContainer.appendChild(voxelDiv);
                }
            }
        }

        // Initialize empty editor layout configuration
        renderEditorLayer();
    </script>
</body>
</html>
